# 独立 PGV（protoc-gen-validate）模板：T15 显式固定本轮校验生成范围。
#
# 插件、参数、managed 配置与输出映射逐字取自 api/buf.gen.yaml 中原有的 validate 段，
# 唯一新增的是文件级 paths 范围（清单由 tools/config/pgv-scope.json 固定，
# 来源是已验收提交 627783c 里 103 个 .pb.validate.go 的 // source: 头）。
# paths 相对 Buf 模块根（与 api/buf.admin.openapi.gen.yaml 的写法一致）。
# 因此：普通 Go/gRPC/HTTP/OpenAPI/redact/conf 生成范围不变，只有校验生成被限制在
# 已验收来源集合；不裁剪类型、不加 skip、不删 Proto 字段，也不靠生成后再删文件。
# clean 必须为 false：共享输出根里的其他模板产物与手写 runtime 不能被本模板清除。
version: v2

clean: false

managed:
  enabled: true

  disable:
    - module: buf.build/googleapis/googleapis
    - module: 'buf.build/envoyproxy/protoc-gen-validate'
    - module: 'buf.build/kratos/apis'
    - module: 'buf.build/gnostic/gnostic'
    - module: 'buf.build/gogo/protobuf'

  override:
    # global go_package_prefix option
    # 如果没有在各目录下单独配置go_package，则会使用该前缀。
    - file_option: go_package_prefix
      value: go-wind-admin/api/gen/go

    # per-directory go_package options
    # value第一部分是生成代码的包路径，第二部分是go包名。
    - file_option: go_package
      path: admin/service/v1
      value: go-wind-admin/api/gen/go/admin/service/v1;adminpb
    - file_option: go_package
      path: audit/service/v1
      value: go-wind-admin/api/gen/go/audit/service/v1;auditpb
    - file_option: go_package
      path: access_key/service/v1
      value: go-wind-admin/api/gen/go/access_key/service/v1;accesskeypb
    - file_option: go_package
      path: authentication/service/v1
      value: go-wind-admin/api/gen/go/authentication/service/v1;authenticationpb
    - file_option: go_package
      path: dict/service/v1
      value: go-wind-admin/api/gen/go/dict/service/v1;dictpb
    - file_option: go_package
      path: storage/service/v1
      value: go-wind-admin/api/gen/go/storage/service/v1;storagepb
    - file_option: go_package
      path: internal_message/service/v1
      value: go-wind-admin/api/gen/go/internal_message/service/v1;internalmessagepb
    - file_option: go_package
      path: permission/service/v1
      value: go-wind-admin/api/gen/go/permission/service/v1;permissionpb
    - file_option: go_package
      path: task/service/v1
      value: go-wind-admin/api/gen/go/task/service/v1;taskpb
    - file_option: go_package
      path: identity/service/v1
      value: go-wind-admin/api/gen/go/identity/service/v1;identitypb
    - file_option: go_package
      path: resource/service/v1
      value: go-wind-admin/api/gen/go/permission/service/v1;resourcepb
    - file_option: go_package
      path: redis_cache/service/v1
      value: go-wind-admin/api/gen/go/redis_cache/service/v1;rediscachepb
    - file_option: go_package
      path: config/service/v1
      value: go-wind-admin/api/gen/go/config/service/v1;configpb

    # 本地化分页 Proto（api/localdeps/pagination，源码与 go-crud/api@v0.0.7 逐字节一致）。
    # managed 全局前缀 go-wind-admin/api/gen/go 对此 Proto 例外：生成到 pkg/localdeps 目标，
    # Go 包名保持上游生成物的 v1（原 option go_package 的 ;pagination 别名在上游生成物中
    # 已被 go_package_prefix 抹去，这里复刻既有行为，不改变协议）。
    - file_option: go_package
      path: pagination/v1
      value: go-wind-admin/pkg/localdeps/go-crud/api/gen/go/pagination/v1

    # 本地化脱敏 Proto（api/localdeps/redact，与 protoc-gen-go-redact 锁定归档逐字节一致）。
    # 这一条取代原先 managed.disable 里的外部模块 buf.build/go-wind/redact：接管后 redact 的
    # go_package 必须与生成器 imports.go 标准 import 表里的本地运行时路径逐字符相等，
    # Module.importPaths 才会把这个 import 认作脱敏运行时本身并沿用别名 redact，
    # 生成的 .pb.redact.go 才引用得到符号。;redact 包名别名保持归档生成物一致，协议内容不变。
    - file_option: go_package
      path: redact/v1
      value: go-wind-admin/pkg/localdeps/go-wind-toolkit/protoc-gen-go-redact/redact/v1;redact
