syntax = "proto3";
package gpu.service.v1;

import "gpu/service/v1/gpu.proto";
import "quota/service/v1/quota_catalog.proto";

// A current-only platform page. Two metrics per tenant share the GPU request
// budget, so at most six tenants fit the twelve-series limit.
message ListGpuTenantsRequest {
  optional uint32 page = 1;
  optional uint32 page_size = 2 [json_name="pageSize"];
  optional uint32 tenant_id = 3 [json_name="tenantId"];
}
message GpuTenantCurrentSummary {
  // Tenant identity and all quota accounts come from one Gov read snapshot.
  quota.service.v1.TenantQuotaAccountSummary quota = 1;
  // Independent latest observation, never a 30-day range or quota balance.
  // Absent when usage_status is UNAVAILABLE. Missing values remain null.
  GpuQueryResponse usage = 2;
  // AVAILABLE, PARTIAL, NO_DATA or UNAVAILABLE. Inspect each metric's quality.
  string usage_status = 3 [json_name="usageStatus"];
  // Stable public code only; never a dependency error message or runtime ID.
  string usage_reason = 4 [json_name="usageReason"];
  reserved 5; reserved "allocation";
  string observation_basis = 6 [json_name="observation_basis"];
  string owner_scope = 7 [json_name="owner_scope"];
}
message ListGpuTenantsResponse {
  repeated GpuTenantCurrentSummary items = 1;
  // Number of tenants, including those without quota policies or observations.
  uint64 total = 2;
}
