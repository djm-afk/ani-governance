syntax = "proto3";
package catalog.service.v1;
import "gnostic/openapi/v3/annotations.proto";

// Governance owns these HTTP views. They deliberately omit delegated identity,
// runtime plans, provider credentials and tenant binding topology.
message AcceleratorPageRequest {
  uint32 page_size = 1 [json_name="page_size"];
  string page_token = 2 [json_name="page_token"];
  string cluster_id = 3 [json_name="cluster_id"];
  string pool_id = 4 [json_name="pool_id"];
  string group_id = 5 [json_name="group_id"];
  string physical_device_id = 6 [json_name="physical_device_id"];
  string owner_service = 7 [json_name="owner_service"];
  string mode = 8;
  string state = 9;
}

message AcceleratorTenantPageRequest {
  uint32 page_size = 1 [json_name="page_size"];
  string page_token = 2 [json_name="page_token"];
  string cluster_id = 3 [json_name="cluster_id"];
  string owner_service = 4 [json_name="owner_service"];
  string mode = 5;
  string state = 6;
}
message AcceleratorTenantVersionRequest {
  string profile_id = 1 [json_name="profile_id"];
  uint64 profile_version = 2 [json_name="profile_version"];
}

message AcceleratorNode { string uid = 1; string name = 2; }
message AcceleratorBaseline {
  string baseline_id = 1 [json_name="baseline_id"];
  string adapter_id = 2 [json_name="adapter_id"];
  reserved 3, 4, 5, 6, 7, 9, 10, 12, 13, 15, 16, 17, 18;
  reserved "volcano_version", "volcano_image_digest", "device_plugin_version", "device_plugin_image_digest", "hami_core_revision", "factor_evidence_ref", "memory_encoding", "memory_scale_percent", "core_scale_percent", "node_config_digest", "scheduler_config_digest", "recipe_version", "baseline_digest";
  uint32 memory_block_mib = 8 [json_name="memory_block_mib"];
  uint32 split_count = 11 [json_name="split_count"];
  bool core_budget_additive = 14 [json_name="core_budget_additive"];
  string runtime_class_name = 19 [json_name="runtime_class_name"];
  repeated AcceleratorResourceTypeConfig resource_types = 20 [json_name="resource_types"];
}
message AcceleratorResourceTypeConfig {
  string allocation_type = 1 [json_name="allocation_type"];
  string resource_key = 2 [json_name="resource_key"];
  uint64 memory_capacity_bytes = 3 [json_name="memory_capacity_bytes"];
  uint32 compute_units_per_device = 4 [json_name="compute_units_per_device"];
  uint32 max_devices_per_replica = 5 [json_name="max_devices_per_replica"];
  int64 max_memory_mib_per_device = 6 [json_name="max_memory_mib_per_device"];
}
message AcceleratorProfileSpec {
  string group_id = 1 [json_name="group_id"];
  string mode = 2;
  string model_key = 3 [json_name="model_key"];
  reserved 4; reserved "shared_memory_mib";
  int64 memory_mib_per_device = 8 [json_name="memory_mib_per_device"];
  uint32 core_limit_percent = 5 [json_name="core_limit_percent"];
  uint32 max_devices_per_replica = 6 [json_name="max_devices_per_replica"];
  string isolation_class = 7 [json_name="isolation_class"];
  string allocation_type = 9 [json_name="allocation_type"];
  string resource_key = 10 [json_name="resource_key"];
  uint32 compute_units_per_device = 11 [json_name="compute_units_per_device"];
}
message RegisterAcceleratorClusterRequest { RegisterAcceleratorClusterData data = 1; }
message RegisterAcceleratorClusterData {
  string idempotency_key = 1 [json_name="idempotency_key"];
  string display_name = 2 [json_name="display_name"];
  string connection_ref = 3 [json_name="connection_ref"];
}
message CreateAcceleratorPoolRequest { CreateAcceleratorPoolData data = 1; }
message CreateAcceleratorPoolData {
  string idempotency_key = 1 [json_name="idempotency_key"];
  string display_name = 2 [json_name="display_name"];
  string cluster_id = 3 [json_name="cluster_id"];
}
message AdoptAcceleratorSupplyRequest { AdoptAcceleratorSupplyData data = 1; }
message AdoptAcceleratorSupplyData {
  string idempotency_key = 1 [json_name="idempotency_key"];
  string display_name = 2 [json_name="display_name"];
  string pool_id = 3 [json_name="pool_id"];
  reserved 4; reserved "mode";
  repeated AcceleratorNode nodes = 5;
  string model_key = 6 [json_name="model_key"];
  AcceleratorBaseline baseline = 7;
  string queue_name = 8 [json_name="queue_name"];
}
message SetAcceleratorAdmissionRequest {
  string group_id = 1 [json_name="group_id"];
  SetAcceleratorAdmissionData data = 2;
}
message SetAcceleratorAdmissionData {
  string idempotency_key = 1 [json_name="idempotency_key"];
  uint64 expected_version = 2 [json_name="expected_version"];
  string desired = 3;
  string reason = 4;
}
message CreateAcceleratorProfileRequest { CreateAcceleratorProfileData data = 1; }
message CreateAcceleratorProfileData {
  string idempotency_key = 1 [json_name="idempotency_key"];
  string display_name = 2 [json_name="display_name"];
  AcceleratorProfileSpec spec = 3;
  uint64 expected_group_version = 4 [json_name="expected_group_version"];
  reserved 5; reserved "verification_ref";
}
message AcceleratorCluster {
  string cluster_id = 1 [json_name="cluster_id"];
  string display_name = 2 [json_name="display_name"];
  string connection_ref = 3 [json_name="connection_ref"];
  uint64 version = 4;
}
message AcceleratorClusters { repeated AcceleratorCluster items = 1; string next_page_token = 2 [json_name="next_page_token"]; }
message AcceleratorPool {
  string pool_id = 1 [json_name="pool_id"];
  string cluster_id = 2 [json_name="cluster_id"];
  string display_name = 3 [json_name="display_name"];
}
message AcceleratorPools { repeated AcceleratorPool items = 1; string next_page_token = 2 [json_name="next_page_token"]; }
message AcceleratorSupply {
  string group_id = 1 [json_name="group_id"];
  string pool_id = 2 [json_name="pool_id"];
  string cluster_id = 3 [json_name="cluster_id"];
  string display_name = 4 [json_name="display_name"];
  reserved 5; reserved "mode";
  repeated AcceleratorNode nodes = 6;
  string model_key = 7 [json_name="model_key"];
  AcceleratorBaseline baseline = 8;
  string admission = 9;
  string queue_name = 10 [json_name="queue_name"];
  uint64 version = 11;
  string adopted_at = 12 [json_name="adopted_at"];
  reserved 13; reserved "verification_state";
}
message AcceleratorSupplies { repeated AcceleratorSupply items = 1; string next_page_token = 2 [json_name="next_page_token"]; }
message AcceleratorProfile {
  string profile_id = 1 [json_name="profile_id"];
  uint64 profile_version = 2 [json_name="profile_version"];
  string display_name = 3 [json_name="display_name"];
  AcceleratorProfileSpec spec = 4;
  reserved 5; reserved "published";
  string state = 6;
  uint64 revision = 7;
}
message AcceleratorProfiles { repeated AcceleratorProfile items = 1; string next_page_token = 2 [json_name="next_page_token"]; }
message AcceleratorObservation {
  bool complete = 1;
  string observed_at = 2 [json_name="observed_at"];
  repeated string issues = 3;
}


message AcceleratorDevice {
  string device_id = 1 [json_name="device_id"];
  string cluster_id = 2 [json_name="cluster_id"];
  string group_id = 3 [json_name="group_id"];
  AcceleratorNode node = 4;
  reserved 5, 7; reserved "vendor_device_id", "physical_memory_bytes";
  string model_key = 6 [json_name="model_key"];
  string health = 8;
  AcceleratorObservation observation = 9;
  string device_uid = 10 [json_name="device_uid"];
  string parent_device_uid = 11 [json_name="parent_device_uid"];
  string device_kind = 12 [json_name="device_kind"];
  optional uint64 memory_capacity_bytes = 13 [json_name="memory_capacity_bytes", (gnostic.openapi.v3.property) = { type: "string" format: "uint64" nullable: true }];
  optional uint32 compute_units = 14 [json_name="compute_units", (gnostic.openapi.v3.property) = { nullable: true }];
  string pci_bdf = 15 [json_name="pci_bdf"];
  string adapter_id = 16 [json_name="adapter_id"];
  string resource_key = 17 [json_name="resource_key"];
}
message AcceleratorDevices { repeated AcceleratorDevice items = 1; string next_page_token = 2 [json_name="next_page_token"]; }


// Tenant view has no physical/Pod IDs, source evidence, raw watermarks or plans.










message PreviewAcceleratorProfileRequest { string group_id = 1 [json_name="group_id"]; uint32 parts = 2; }
message AcceleratorProfilePreview { AcceleratorProfileSpec spec = 1; int64 unused_memory_mib = 2 [json_name="unused_memory_mib"]; uint32 unused_core_units = 3 [json_name="unused_core_units"]; }
message SetAcceleratorProfileStateRequest { string profile_id = 1 [json_name="profile_id"]; SetAcceleratorProfileStateData data = 2; }
message SetAcceleratorProfileStateData { string idempotency_key = 1 [json_name="idempotency_key"]; uint64 expected_revision = 2 [json_name="expected_revision"]; string desired = 3; }
message DeleteAcceleratorProfileRequest { string profile_id = 1 [json_name="profile_id"]; DeleteAcceleratorProfileData data = 2; }
message DeleteAcceleratorProfileData { string idempotency_key = 1 [json_name="idempotency_key"]; uint64 expected_revision = 2 [json_name="expected_revision"]; }

message AcceleratorInitializationCheck {
  string key = 1;
  string source = 2;
  string state = 3;
  string reason = 4;
}
message AcceleratorInitialization {
  bool registered = 1;
  string connection_ref = 2 [json_name="connection_ref"];
  string cluster_id = 3 [json_name="cluster_id"];
  string display_name = 4 [json_name="display_name"];
  string configuration_state = 5 [json_name="configuration_state"];
  repeated AcceleratorInitializationCheck checks = 6;
  AcceleratorInitializationOperation latest_operation = 7 [json_name="latest_operation"];
  bool configuration_complete = 8 [json_name="configuration_complete"];
}
message ListAcceleratorDiscoveredNodesRequest {
  optional uint32 page = 1;
  optional uint32 page_size = 2 [json_name="pageSize"];
  string connection_ref = 3 [json_name="connection_ref"];
}


message AcceleratorDiscoveredNode {
  AcceleratorNode node = 1;
  string group_id = 2 [json_name="group_id"];
  reserved 3, 4, 5, 6, 7;
  reserved "gpus", "baselines", "agent_online", "agent_lease_expires_at", "sources";
  bool selectable = 8;
  repeated string blocking_reasons = 9 [json_name="blocking_reasons"];
  repeated AcceleratorDevice devices = 10;
  repeated AcceleratorDiscoveredProviderConfig provider_configs = 11 [json_name="provider_configs"];
}
message AcceleratorDiscoveredNodes {
  repeated AcceleratorDiscoveredNode items = 1;
  uint64 total = 2;
  string discovery_revision = 3 [json_name="discovery_revision"];
}
message AcceleratorInitializationNewPool { string display_name = 1 [json_name="display_name"]; }
message AcceleratorInitializationPoolInput {
  string client_key = 1 [json_name="client_key"];
  oneof pool {
    string existing_pool_id = 2 [json_name="existing_pool_id"];
    AcceleratorInitializationNewPool new_pool = 3 [json_name="new_pool"];
  }
}
message AcceleratorInitializationExistingGroup {
  string group_id = 1 [json_name="group_id"];
  uint64 expected_version = 2 [json_name="expected_version"];
}
message AcceleratorInitializationNewGroup {
  string pool_key = 1 [json_name="pool_key"];
  string display_name = 2 [json_name="display_name"];
  repeated AcceleratorNode nodes = 3;
  reserved 4; reserved "baseline_ref";
  string provider_config_ref = 6 [json_name="provider_config_ref"];
  string queue_name = 5 [json_name="queue_name"];
}
message AcceleratorInitializationGroupInput {
  string client_key = 1 [json_name="client_key"];
  oneof group {
    AcceleratorInitializationExistingGroup existing_group = 2 [json_name="existing_group"];
    AcceleratorInitializationNewGroup new_group = 3 [json_name="new_group"];
  }
}
message AcceleratorInitializationProfileInput {
  string client_key = 1 [json_name="client_key"];
  string group_key = 2 [json_name="group_key"];
  string display_name = 3 [json_name="display_name"];
  int64 memory_mib_per_device = 4 [json_name="memory_mib_per_device"];
  uint32 core_limit_percent = 5 [json_name="core_limit_percent"];
  uint32 max_devices_per_replica = 6 [json_name="max_devices_per_replica"];
  string allocation_type = 7 [json_name="allocation_type"];
  string resource_key = 8 [json_name="resource_key"];
  uint32 compute_units_per_device = 9 [json_name="compute_units_per_device"];
}
message CreateAcceleratorInitializationRequest { CreateAcceleratorInitializationData data = 1; }
message CreateAcceleratorInitializationData {
  string idempotency_key = 1 [json_name="idempotency_key"];
  string discovery_revision = 2 [json_name="discovery_revision"];
  repeated AcceleratorInitializationPoolInput pools = 3;
  repeated AcceleratorInitializationGroupInput groups = 4;
  repeated AcceleratorInitializationProfileInput profiles = 5;
  string connection_ref = 6 [json_name="connection_ref"];
}
message GetAcceleratorInitializationOperationRequest { string operation_id = 1 [json_name="operation_id"]; }
message RetryAcceleratorInitializationOperationRequest {
  string operation_id = 1 [json_name="operation_id"];
  RetryAcceleratorInitializationOperationData data = 2;
}
message RetryAcceleratorInitializationOperationData {
  string idempotency_key = 1 [json_name="idempotency_key"];
  uint64 expected_version = 2 [json_name="expected_version"];
}
message AcceleratorInitializationPoolResult {
  string client_key = 1 [json_name="client_key"];
  string pool_id = 2 [json_name="pool_id"];
}
message AcceleratorInitializationGroupResult {
  string client_key = 1 [json_name="client_key"];
  string group_id = 2 [json_name="group_id"];
  uint64 recorded_group_version = 3 [json_name="recorded_group_version"];
  string auto_open_result = 4 [json_name="auto_open_result"];
  string admission = 5;
}
message AcceleratorInitializationProfileResult {
  string client_key = 1 [json_name="client_key"];
  string profile_id = 2 [json_name="profile_id"];
  uint64 recorded_revision = 3 [json_name="recorded_revision"];
  string recorded_state = 4 [json_name="recorded_state"];
}
message AcceleratorInitializationStep {
  string step_id = 1 [json_name="step_id"];
  string object_key = 2 [json_name="object_key"];
  string kind = 3;
  string state = 4;
  string resource_id = 5 [json_name="resource_id"];
  uint64 input_group_version = 6 [json_name="input_group_version"];
  uint64 output_group_version = 7 [json_name="output_group_version"];
  string reason = 8;
}
message AcceleratorInitializationOperation {
  string operation_id = 1 [json_name="operation_id"];
  uint64 version = 2;
  string state = 3;
  string created_at = 4 [json_name="created_at"];
  string updated_at = 5 [json_name="updated_at"];
  string current_step = 6 [json_name="current_step"];
  bool retryable = 7;
  string reason = 8;
  repeated string required_actions = 9 [json_name="required_actions"];
  string cluster_id = 10 [json_name="cluster_id"];
  repeated AcceleratorInitializationPoolResult pools = 11;
  repeated AcceleratorInitializationGroupResult groups = 12;
  repeated AcceleratorInitializationProfileResult profiles = 13;
  repeated AcceleratorInitializationStep steps = 14;
}

message GetAcceleratorInitializationRequest { string connection_ref = 1 [json_name="connection_ref"]; }
message AcceleratorDiscoveredProviderConfig {
  string provider_config_ref = 1 [json_name="provider_config_ref"];
  string adapter_id = 2 [json_name="adapter_id"];
  repeated string allocation_types = 3 [json_name="allocation_types"];
}
message GetAcceleratorProfileCapacityRequest {
  string profile_id = 1 [json_name="profile_id"];
  uint64 profile_version = 2 [json_name="profile_version", (gnostic.openapi.v3.property) = { type: "string" format: "uint64" }];
  bool include_details = 3 [json_name="include_details"];
}
message GetAcceleratorSupplyGroupCapacityRequest {
  string group_id = 1 [json_name="group_id"];
  bool include_details = 2 [json_name="include_details"];
}
message AcceleratorCapacityTotals {
  optional int64 total_units = 1 [json_name="total_units", (gnostic.openapi.v3.property) = { type: "string" format: "int64" nullable: true }];
  optional int64 allocated_units = 2 [json_name="allocated_units", (gnostic.openapi.v3.property) = { type: "string" format: "int64" nullable: true }];
  optional int64 unallocated_units = 3 [json_name="unallocated_units", (gnostic.openapi.v3.property) = { type: "string" format: "int64" nullable: true }];
  optional int64 total_memory_mib = 4 [json_name="total_memory_mib", (gnostic.openapi.v3.property) = { type: "string" format: "int64" nullable: true }];
  optional int64 allocated_memory_mib = 5 [json_name="allocated_memory_mib", (gnostic.openapi.v3.property) = { type: "string" format: "int64" nullable: true }];
  optional int64 unallocated_memory_mib = 6 [json_name="unallocated_memory_mib", (gnostic.openapi.v3.property) = { type: "string" format: "int64" nullable: true }];
}
message AcceleratorCapacityDetail {
  string node_uid = 1 [json_name="node_uid"];
  string node_name = 2 [json_name="node_name"];
  string device_uid = 3 [json_name="device_uid"];
  AcceleratorCapacityTotals totals = 4;
  optional int64 nominal_units = 5 [json_name="nominal_units", (gnostic.openapi.v3.property) = { type: "string" format: "int64" nullable: true }];
  optional int64 estimated_available_units = 6 [json_name="estimated_available_units", (gnostic.openapi.v3.property) = { type: "string" format: "int64" nullable: true }];
}
message AcceleratorProfileCapacity {
  string profile_id = 1 [json_name="profile_id"];
  uint64 profile_version = 2 [json_name="profile_version", (gnostic.openapi.v3.property) = { type: "string" format: "uint64" }];
  string allocation_type = 3 [json_name="allocation_type"];
  string resource_key = 4 [json_name="resource_key"];
  string basis = 5;
  string granularity = 6;
  optional int64 nominal_units = 7 [json_name="nominal_units", (gnostic.openapi.v3.property) = { type: "string" format: "int64" nullable: true }];
  optional int64 estimated_available_units = 8 [json_name="estimated_available_units", (gnostic.openapi.v3.property) = { type: "string" format: "int64" nullable: true }];
  AcceleratorCapacityTotals totals = 9;
  repeated AcceleratorCapacityDetail details = 10;
  string observed_at = 11 [json_name="observed_at"];
  repeated string missing_fields = 12 [json_name="missing_fields"];
}
message AcceleratorResourceTypeCapacity {
  string allocation_type = 1 [json_name="allocation_type"];
  string resource_key = 2 [json_name="resource_key"];
  string basis = 3;
  string granularity = 4;
  AcceleratorCapacityTotals totals = 5;
  repeated AcceleratorCapacityDetail details = 6;
  string observed_at = 7 [json_name="observed_at"];
  repeated string missing_fields = 8 [json_name="missing_fields"];
}
message AcceleratorSupplyGroupCapacity {
  string group_id = 1 [json_name="group_id"];
  optional int64 physical_device_count = 2 [json_name="physical_device_count", (gnostic.openapi.v3.property) = { type: "string" format: "int64" nullable: true }];
  repeated AcceleratorResourceTypeCapacity resource_types = 3 [json_name="resource_types"];
  string observed_at = 4 [json_name="observed_at"];
}
