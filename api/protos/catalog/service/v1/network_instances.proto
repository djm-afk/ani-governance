syntax = "proto3";

package catalog.service.v1;

import "google/protobuf/timestamp.proto";

// Current, not-yet-released Network attachments in the authenticated tenant.
// Supply at least one network ID. Both IDs narrow the result to that subnet.
message ListNetworkInstancesRequest {
 string vpc_id = 1 [json_name = "vpc_id"];
 string subnet_id = 2 [json_name = "subnet_id"];
 optional uint32 page = 3 [json_name = "page"];
 optional uint32 page_size = 4 [json_name = "pageSize"];
}

message NetworkInstanceAddress {
 string nic_name = 1 [json_name = "nic_name"];
 string address = 2 [json_name = "address"];
}

message NetworkAssociatedInstance {
 string consumer_type = 1 [json_name = "consumer_type"];
 string consumer_id = 2 [json_name = "consumer_id"];
 string consumer_name = 3 [json_name = "consumer_name"];
 string consumer_state = 4 [json_name = "consumer_state"];
 string subnet_id = 5 [json_name = "subnet_id"];
 string subnet_name = 6 [json_name = "subnet_name"];
 string slot = 7 [json_name = "slot"];
 string attachment_id = 8 [json_name = "attachment_id"];
 string attachment_state = 9 [json_name = "attachment_state"];
 string attachment_reason = 10 [json_name = "attachment_reason"];
 bool observation_stale = 11 [json_name = "observation_stale"];
 google.protobuf.Timestamp observed_at = 12 [json_name = "observed_at"];
 repeated NetworkInstanceAddress addresses = 13 [json_name = "addresses"];
}

message ListNetworkInstancesResponse {
 repeated NetworkAssociatedInstance items = 1 [json_name = "items"];
 int64 total = 2 [json_name = "total"];
}
