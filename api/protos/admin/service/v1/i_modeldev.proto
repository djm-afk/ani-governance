syntax = "proto3";

package admin.service.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "modeldev/service/v1/environment.proto";
import "modeldev/service/v1/dataset.proto";
import "modeldev/service/v1/execution.proto";

// CPU-P01 entry in the existing Governance BFF.
service ModelDevService {
  rpc EnsureTenantExecutionEnvironment(modeldev.service.v1.EnsureTenantExecutionEnvironmentRequest) returns (modeldev.service.v1.EnsureTenantExecutionEnvironmentResponse) {
    option (google.api.http) = {
      post: "/api/v1/modeldev/environment:ensure"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      description: "Explicit current-tenant environment provisioning. Exactly one canonical UUID Idempotency-Key header, empty JSON object at most 1024 bytes, no query. No execution or quota admission."
      security: {
        additional_properties: {
          name: "BearerAuth"
          value: {}
        }
      }
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            required: true
            schema: {
              schema: {
                type: "string"
                format: "uuid"
              }
            }
          }
        }
      ]
      responses: {
        response_or_reference: [
          {
            name: "200"
            value: {
              response: {
                description: "Persistent READY, BLOCKED or NEEDS_REVIEW observation"
                content: {
                  additional_properties: [
                    {
                      name: "application/json"
                      value: {
                        schema: {
                          reference: {_ref: "#/components/schemas/EnsureTenantExecutionEnvironmentResponse"}
                        }
                      }
                    }
                  ]
                }
              }
            }
          },
          {
            name: "202"
            value: {
              response: {
                description: "Persistent PROVISIONING; explicitly retry the same key"
                headers: {
                  additional_properties: [
                    {
                      name: "Retry-After"
                      value: {
                        header: {
                          required: true
                          schema: {
                            schema: {
                              type: "integer"
                              format: "int32"
                            }
                          }
                        }
                      }
                    }
                  ]
                }
                content: {
                  additional_properties: [
                    {
                      name: "application/json"
                      value: {
                        schema: {
                          reference: {_ref: "#/components/schemas/EnsureTenantExecutionEnvironmentResponse"}
                        }
                      }
                    }
                  ]
                }
              }
            }
          }
        ]
      }
    };
  }
  rpc GetTenantExecutionEnvironment(modeldev.service.v1.GetTenantExecutionEnvironmentRequest) returns (modeldev.service.v1.GetTenantExecutionEnvironmentResponse) {
    option (google.api.http) = {get: "/api/v1/modeldev/environment"};
    option (gnostic.openapi.v3.operation) = {
      description: "Read current-tenant persistent environment observation. No body/query, no provisioning or live probe."
      security: {
        additional_properties: {
          name: "BearerAuth"
          value: {}
        }
      }
      responses: {
        response_or_reference: [
          {
            name: "200"
            value: {
              response: {
                description: "Persistent environment observation"
                content: {
                  additional_properties: [
                    {
                      name: "application/json"
                      value: {
                        schema: {
                          reference: {_ref: "#/components/schemas/GetTenantExecutionEnvironmentResponse"}
                        }
                      }
                    }
                  ]
                }
              }
            }
          },
          {
            name: "404"
            value: {
              response: {description: "ENVIRONMENT_NOT_REGISTERED; no row is created"}
            }
          }
        ]
      }
    };
  }

  rpc CheckFinetuningReadiness(modeldev.service.v1.CheckFinetuningReadinessRequest) returns (modeldev.service.v1.CheckFinetuningReadinessResponse) {
    option (google.api.http) = {
      post: "/api/v1/modeldev/finetuning/readiness/check"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {description: "Source-only model eligibility under current model-read and training compute-catalog grants; no target write or GPU allocation. 200 assessment is not execution acceptance."};
  }
  rpc ListImplementations(modeldev.service.v1.ListImplementationsRequest) returns (modeldev.service.v1.ListImplementationsResponse) {
    option (google.api.http) = {get: "/api/v1/modeldev/implementations"};
  }
  rpc GetInputVersion(modeldev.service.v1.GetInputVersionRequest) returns (modeldev.service.v1.GetInputVersionResponse) {
    option (google.api.http) = {
      get: "/api/v1/modeldev/input-versions/{input_version_id}"
      response_body: "input_version"
    };
    option (gnostic.openapi.v3.operation) = {
      responses: {
        response_or_reference: [
          {
            name: "200"
            value: {
              response: {
                description: "OK"
                content: {
                  additional_properties: [
                    {
                      name: "application/json"
                      value: {
                        schema: {
                          reference: {_ref: "#/components/schemas/InputVersionView"}
                        }
                      }
                    }
                  ]
                }
              }
            }
          }
        ]
      }
    };
  }
  rpc ListInputVersions(modeldev.service.v1.ListInputVersionsRequest) returns (modeldev.service.v1.ListInputVersionsResponse) {
    option (google.api.http) = {get: "/api/v1/modeldev/input-versions"};
  }
  rpc ListExecutions(modeldev.service.v1.ListExecutionsRequest) returns (modeldev.service.v1.ListExecutionsResponse) {
    option (google.api.http) = {get: "/api/v1/modeldev/executions"};
  }
  rpc GetExecutionLogs(modeldev.service.v1.GetExecutionLogsRequest) returns (modeldev.service.v1.GetExecutionLogsResponse) {
    option (google.api.http) = {get: "/api/v1/modeldev/executions/{execution_id}/logs"};
  }
  rpc ListExecutionPods(modeldev.service.v1.ListExecutionPodsRequest) returns (modeldev.service.v1.ListExecutionPodsResponse) {
    option (google.api.http) = {get: "/api/v1/modeldev/executions/{execution_id}/pods"};
  }
  rpc ListExecutionEvents(modeldev.service.v1.ListExecutionEventsRequest) returns (modeldev.service.v1.ListExecutionEventsResponse) {
    option (google.api.http) = {get: "/api/v1/modeldev/executions/{execution_id}/events"};
  }
  rpc QueryExecutionMetrics(modeldev.service.v1.QueryExecutionMetricsRequest) returns (modeldev.service.v1.QueryExecutionMetricsResponse) {
    option (google.api.http) = {get: "/api/v1/modeldev/executions/{execution_id}/resource-metrics"};
  }
  rpc StopExecution(modeldev.service.v1.StopExecutionRequest) returns (modeldev.service.v1.StopExecutionResponse) {
    option (google.api.http) = {post: "/api/v1/modeldev/executions/{execution_id}:stop"};
    option (gnostic.openapi.v3.operation) = {
      security: {
        additional_properties: {
          name: "BearerAuth"
          value: {}
        }
      }
      responses: {
        response_or_reference: [
          {
            name: "202"
            value: {
              response: {
                description: "Durable stop intent accepted; resources are not yet confirmed closed"
                content: {
                  additional_properties: [
                    {
                      name: "application/json"
                      value: {
                        schema: {
                          reference: {_ref: "#/components/schemas/StopExecutionResponse"}
                        }
                      }
                    }
                  ]
                }
              }
            }
          }
        ]
      }
    };
  }
  rpc ResumeModelRegistration(modeldev.service.v1.ResumeModelRegistrationRequest) returns (modeldev.service.v1.GetExecutionResponse) {
    option (google.api.http) = {
      post: "/api/v1/modeldev/executions/{execution_id}:resume-model-registration"
      response_body: "execution"
    };
    option (gnostic.openapi.v3.operation) = {
      security: {
        additional_properties: {
          name: "BearerAuth"
          value: {}
        }
      }
      responses: {
        response_or_reference: [
          {
            name: "200"
            value: {
              response: {
                description: "Current original execution and its persisted model-registration observation"
                content: {
                  additional_properties: [
                    {
                      name: "application/json"
                      value: {
                        schema: {
                          reference: {_ref: "#/components/schemas/ExecutionView"}
                        }
                      }
                    }
                  ]
                }
              }
            }
          }
        ]
      }
    };
  }
  rpc GetExecution(modeldev.service.v1.GetExecutionRequest) returns (modeldev.service.v1.GetExecutionResponse) {
    option (google.api.http) = {
      get: "/api/v1/modeldev/executions/{execution_id}"
      response_body: "execution"
    };
    option (gnostic.openapi.v3.operation) = {
      responses: {
        response_or_reference: [
          {
            name: "200"
            value: {
              response: {
                description: "OK"
                content: {
                  additional_properties: [
                    {
                      name: "application/json"
                      value: {
                        schema: {
                          reference: {_ref: "#/components/schemas/ExecutionView"}
                        }
                      }
                    }
                  ]
                }
              }
            }
          }
        ]
      }
    };
  }
  rpc ListExecutionArtifacts(modeldev.service.v1.ListExecutionArtifactsRequest) returns (modeldev.service.v1.ListExecutionArtifactsResponse) {
    option (google.api.http) = {get: "/api/v1/modeldev/executions/{execution_id}/artifacts"};
  }
  rpc AuthorizeArtifactDownload(modeldev.service.v1.AuthorizeArtifactDownloadRequest) returns (modeldev.service.v1.AuthorizeArtifactDownloadResponse) {
    option (google.api.http) = {get: "/api/v1/modeldev/artifacts/{artifact_id}/content"};
  }
  rpc CreateExecution(modeldev.service.v1.CreateExecutionRequest) returns (modeldev.service.v1.CreateExecutionResponse) {
    option (gnostic.openapi.v3.operation) = {
      security: {
        additional_properties: {
          name: "BearerAuth"
          value: {}
        }
      }
      responses: {
        response_or_reference: [
          {
            name: "202"
            value: {
              response: {
                description: "Accepted; the frozen request and CPU delivery intent are durable"
                content: {
                  additional_properties: [
                    {
                      name: "application/json"
                      value: {
                        schema: {
                          reference: {_ref: "#/components/schemas/CreateExecutionResponse"}
                        }
                      }
                    }
                  ]
                }
              }
            }
          }
        ]
      }
    };
    option (google.api.http) = {
      post: "/api/v1/modeldev/executions"
      body: "*"
    };
  }
  // ---- dataset management ----
  rpc CreateDataset(modeldev.service.v1.CreateDatasetRequest) returns (modeldev.service.v1.CreateDatasetResponse) {
    option (google.api.http) = {
      post: "/api/v1/modeldev/datasets"
      body: "*"
    };
  }
  rpc GetDataset(modeldev.service.v1.GetDatasetRequest) returns (modeldev.service.v1.GetDatasetResponse) {
    option (google.api.http) = {
      get: "/api/v1/modeldev/datasets/{dataset_id}"
      response_body: "dataset"
    };
  }
  rpc ListDatasets(modeldev.service.v1.ListDatasetsRequest) returns (modeldev.service.v1.ListDatasetsResponse) {
    option (google.api.http) = {get: "/api/v1/modeldev/datasets"};
  }
  rpc UpdateDataset(modeldev.service.v1.UpdateDatasetRequest) returns (modeldev.service.v1.UpdateDatasetResponse) {
    option (google.api.http) = {
      patch: "/api/v1/modeldev/datasets/{dataset_id}"
      body: "*"
    };
  }
  rpc ArchiveDataset(modeldev.service.v1.ArchiveDatasetRequest) returns (modeldev.service.v1.ArchiveDatasetResponse) {
    option (google.api.http) = {
      post: "/api/v1/modeldev/datasets/{dataset_id}:archive"
      body: "*"
    };
  }
  rpc RestoreDataset(modeldev.service.v1.RestoreDatasetRequest) returns (modeldev.service.v1.RestoreDatasetResponse) {
    option (google.api.http) = {
      post: "/api/v1/modeldev/datasets/{dataset_id}:restore"
      body: "*"
    };
  }
  rpc InspectDatasetSource(modeldev.service.v1.InspectDatasetSourceRequest) returns (modeldev.service.v1.InspectDatasetSourceResponse) {
    option (google.api.http) = {
      post: "/api/v1/modeldev/dataset-sources:inspect"
      body: "*"
    };
  }
  rpc ImportDatasetVersion(modeldev.service.v1.ImportDatasetVersionRequest) returns (modeldev.service.v1.ImportDatasetVersionResponse) {
    option (google.api.http) = {
      post: "/api/v1/modeldev/datasets/{dataset_id}:import"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {description: "Accept one import. 202 with a stable receipt; does not mean the version is ready."};
  }
  rpc ListDatasetVersions(modeldev.service.v1.ListDatasetVersionsRequest) returns (modeldev.service.v1.ListDatasetVersionsResponse) {
    option (google.api.http) = {get: "/api/v1/modeldev/datasets/{dataset_id}/versions"};
  }
  rpc GetInputVersionPreview(modeldev.service.v1.GetInputVersionPreviewRequest) returns (modeldev.service.v1.GetInputVersionPreviewResponse) {
    option (google.api.http) = {
      get: "/api/v1/modeldev/input-versions/{input_version_id}/preview"
      response_body: "preview"
    };
  }
  rpc ListDatasetImportTasks(modeldev.service.v1.ListDatasetImportTasksRequest) returns (modeldev.service.v1.ListDatasetImportTasksResponse) {
    option (google.api.http) = {get: "/api/v1/modeldev/datasets/{dataset_id}/import-tasks"};
  }
  rpc GetDatasetImportTask(modeldev.service.v1.GetDatasetImportTaskRequest) returns (modeldev.service.v1.GetDatasetImportTaskResponse) {
    option (google.api.http) = {
      get: "/api/v1/modeldev/dataset-import-tasks/{import_task_id}"
      response_body: "task"
    };
  }
  rpc CancelDatasetImport(modeldev.service.v1.CancelDatasetImportRequest) returns (modeldev.service.v1.CancelDatasetImportResponse) {
    option (google.api.http) = {post: "/api/v1/modeldev/dataset-import-tasks/{import_task_id}:cancel"};
  }
  rpc RetryDatasetImport(modeldev.service.v1.RetryDatasetImportRequest) returns (modeldev.service.v1.RetryDatasetImportResponse) {
    option (google.api.http) = {post: "/api/v1/modeldev/dataset-import-tasks/{import_task_id}:retry"};
  }
  rpc ListDatasetOperations(modeldev.service.v1.ListDatasetOperationsRequest) returns (modeldev.service.v1.ListDatasetOperationsResponse) {
    option (google.api.http) = {get: "/api/v1/modeldev/datasets/{dataset_id}/operations"};
  }
}
