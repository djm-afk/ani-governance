 rpc GetVPC(catalog.service.v1.GetVPCRequest) returns (catalog.service.v1.GetVPCResponse) {
   option (google.api.http) = { get: "/api/v1/networks/vpcs/{vpc_id}" response_body: "vpc" };
   option (gnostic.openapi.v3.operation) = {
     security: [
       { additional_properties: [{ name: "BearerAuth" value: {} }] },
       { additional_properties: [
         { name: "AccessKeyAuth" value: {} },
         { name: "SignatureAuth" value: {} },
         { name: "SignatureTime" value: {} }
       ] }
     ]
     summary: "Get a visible tenant or registered platform VPC"
     description: "Requires user JWT or ANI HMAC-SHA256 signature, NETWORK subscription and network:vpc:get permission. vpc_id must be vpc_ followed by 32 lowercase hex digits. Query parameters and body are rejected. Public identity headers are ignored. The persisted tenant UUID is looked up from the trusted operator's tenant and replayed downstream. Registered platform IDs remain readable after directory publication or new admission is closed; other tenants' private and missing VPCs return 404. owner_scope is tenant or platform; can_manage and can_use describe resource capabilities. No network lifecycle or data-plane operation is performed."
     responses: { response_or_reference: [
       { name: "200" value: { response: { description: "OK" content: { additional_properties: [{ name: "application/json" value: { schema: { reference: { _ref: "#/components/schemas/VPC" } } } }] } } } },
       { name: "400" value: { response: { description: "Invalid VPC ID or unsupported query" } } },
       { name: "401" value: { response: { description: "Missing, invalid, expired or revoked credentials" } } },
       { name: "403" value: { response: { description: "Tenant, permission or subscription denied" } } },
       { name: "404" value: { response: { description: "VPC not found in this tenant" } } },
       { name: "503" value: { response: { description: "Network dependency or trusted identity unavailable" } } },
       { name: "504" value: { response: { description: "Connected Network call timed out" } } }
     ] }
   };
 }
 rpc ListVPCs(catalog.service.v1.ListVPCsRequest) returns (catalog.service.v1.ListVPCsResponse) {
   option (google.api.http) = { get: "/api/v1/networks/vpcs" };
