         { name: "AccessKeyAuth" value: {} },
         { name: "SignatureAuth" value: {} },
         { name: "SignatureTime" value: {} }
       ] }
     ]
     summary: "List tenant VPCs and published platform VPCs"
     description: "Requires user JWT or ANI HMAC-SHA256 signature, NETWORK subscription and network:vpc:list permission. Page pagination: page defaults to 1, pageSize defaults to 20 (1..100); page is 1..4294967295. Either omitted field uses its own default. Returns items (always an array) and total (decimal string), with direct random-page access and no cross-request snapshot. Legacy limit/cursor and other window names, duplicate/noncanonical/overflow values are rejected with 400. The persisted tenant UUID is looked up from the trusted operator's tenant and replayed downstream. Tenant VPCs and published platform VPCs share one filtered, ordered page and count. Optional can_use/can_manage accept only true or false; omission leaves that capability unfiltered, and both conditions use AND. can_use describes new admission, independently of native Ready or observed addresses. System-managed Intranet resources are excluded downstream."
     responses: { response_or_reference: [
       { name: "400" value: { response: { description: "Invalid page, pageSize, state filter or unsupported legacy window" } } },
       { name: "401" value: { response: { description: "Missing, invalid, expired or revoked credentials" } } },
       { name: "403" value: { response: { description: "Tenant, permission or subscription denied" } } },
       { name: "503" value: { response: { description: "Network dependency or trusted identity unavailable" } } },
       { name: "504" value: { response: { description: "Connected Network call timed out" } } }
     ] }
   };
 }
